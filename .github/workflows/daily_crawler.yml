name: TW BANK RATES UPDATE

on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch: # 保留這個設定，讓您可以隨時在 GitHub 網頁上手動點擊執行測試

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      # 這裡會自動把 GitHub 上的最新 data 拉到雲端環境中，充當您的 "本地" 供程式讀取

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # 使用穩定的 Python 版本

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas

    - name: Run Scraper
      # 這裡將 GitHub Secrets 注入為環境變數給 Python 讀取
      env:
        MY_GITHUB_TOKEN: ${{secrets.MY_GITHUB_TOKEN }}
      run: |
        python cbc_github_tracker.py
